[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-content-brief-engine"
version = "0.4.0"
description = "CLI tool to generate structured SEO content briefs from SERP analysis + LLM synthesis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Mehran Moghadasi", email = "mehran.moghadasi@gmail.com" }
]
keywords = ["seo", "content-brief", "llm", "openai", "marketing", "digital-marketing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "jinja2>=3.1.4",
  "click>=8.1.7",
  "rich>=13.7.1",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-httpx>=0.30.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[project.scripts]
brief = "content_brief.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/content_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 99
target-version = "py311"
